modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
<% if (mod_repository_url) { %>issueTrackerURL = "${mod_repository_url}/issues"
<% } %>

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
<% if (mod_repository_url) { %>displayURL = "${mod_repository_url}"
<% } %>
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
